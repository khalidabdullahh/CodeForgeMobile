name: Build & Release Android APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Web Assets to Android
        env:
          CI: true
          CAPACITOR_TELEMETRY_DISABLED: 1
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap sync android --inline || true

      - name: Build Debug APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/CodeForgeMobile.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeForgeMobile-APK
          path: build-output/CodeForgeMobile.apk

      - name: Publish APK to rolling release (apk-latest)
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CodeForge Mobile - Latest APK
          body: Debug APK built automatically from the latest commit on main.
          prerelease: false
          make_latest: 'false'
          files: build-output/CodeForgeMobile.apk

      - name: Upload APK to GitHub Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/CodeForgeMobile.apk
