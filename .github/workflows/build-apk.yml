name: Build & Release Android APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Web Assets to Android
        env:
          CI: true
          CAPACITOR_TELEMETRY_DISABLED: 1
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap sync android --inline || true

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed Release APK + AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Build Debug APK (no signing key configured)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect build output
        run: |
          mkdir -p build-output
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/CodeForgeMobile.apk
            cp android/app/build/outputs/bundle/release/app-release.aab build-output/CodeForgeMobile.aab
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build-output/CodeForgeMobile.apk | grep -E "Verifies|SHA-256|Number of signers"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/CodeForgeMobile.apk
          fi
          ls -la build-output

      - name: Upload build output as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeForgeMobile-Android
          path: build-output/*

      - name: Publish to rolling release (apk-latest)
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CodeForge Mobile - Latest Android build
          body: |
            Latest build from `main`. Install `CodeForgeMobile.apk` on Android.
            `CodeForgeMobile.aab` is the Play Store bundle (only present for signed release builds).
          prerelease: false
          make_latest: 'false'
          files: build-output/*

      - name: Upload to GitHub Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*
